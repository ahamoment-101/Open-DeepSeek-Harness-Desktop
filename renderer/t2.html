<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>管理 Agent</title>
  <link rel="stylesheet" href="t2.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>Agent 预设</h1>
        <button id="new-btn" class="primary">＋ 新建 Agent</button>
      </div>
      <ul id="preset-list"></ul>
    </aside>
    <main id="editor">
      <div id="empty-state">选择左侧的 agent，或新建一个。</div>
    </main>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <h2>新建 Agent</h2>
      <label>ID（小写字母/数字/连字符）
        <input id="create-id" placeholder="my-agent" />
      </label>
      <label>名称
        <input id="create-name" placeholder="我的 Agent" />
      </label>
      <label>描述
        <input id="create-desc" placeholder="一句话描述…" />
      </label>
      <label>从模板创建
        <select id="create-template">
          <option value="">空白</option>
          <option value="standard">standard</option>
          <option value="minimal">minimal</option>
          <option value="code">code</option>
          <option value="cordis">cordis</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="create-cancel">取消</button>
        <button id="create-confirm" class="primary">创建</button>
      </div>
    </div>
  </div>

  <script src="t2.js"></script>
</body>
</html>
